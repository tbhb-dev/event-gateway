---
# Import contracts. Every package must belong to a component.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false  # deep scanning runs the go command; the test has none

components:
  cmd: {in: cmd/*}

vendors:
  nats:
    in: [github.com/nats-io/nats-server/v2/**, github.com/nats-io/nats.go, github.com/nats-io/nats.go/**]
  telemetry:
    in: [go.opentelemetry.io/otel, go.opentelemetry.io/otel/**]

deps:
  cmd:
    mayDependOn: [cmd]  # a leaf; go-arch-lint rejects an empty list
    canUse: [nats, telemetry]
